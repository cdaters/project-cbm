[Unit]
Requires=pcbm-first-boot.service
After=pcbm-first-boot.service

[Service]
# Quiet appliance output needs no five-second Type=idle console-output deferral.
# All existing first-boot/user-session ordering and getty/login/PAM remain intact.
Type=simple
ExecStart=
ExecStart=-/sbin/agetty --autologin pcbm --noclear %I $TERM
